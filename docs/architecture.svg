<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- Laptop -->
  <rect x="20" y="40" width="250" height="205" rx="10" fill="none" stroke="#8b949e" stroke-dasharray="6 4"/>
  <text x="145" y="66" text-anchor="middle" fill="#8b949e" font-weight="bold">laptop (roaming)</text>

  <rect x="45" y="90" width="200" height="45" rx="8" fill="#1f6feb" fill-opacity="0.13" stroke="#1f6feb"/>
  <text x="145" y="118" text-anchor="middle" fill="#8b949e">herdr --remote</text>

  <rect x="45" y="175" width="200" height="45" rx="8" fill="#1f6feb" fill-opacity="0.13" stroke="#1f6feb"/>
  <text x="145" y="203" text-anchor="middle" fill="#8b949e">herdr-eternal-ssh</text>

  <line x1="145" y1="135" x2="145" y2="175" stroke="#8b949e" marker-end="url(#arrow)"/>
  <text x="155" y="160" fill="#8b949e" font-size="12">ssh_command</text>

  <!-- Server host -->
  <rect x="630" y="40" width="250" height="285" rx="10" fill="none" stroke="#8b949e" stroke-dasharray="6 4"/>
  <text x="755" y="66" text-anchor="middle" fill="#8b949e" font-weight="bold">server (NixOS)</text>

  <rect x="655" y="90" width="200" height="45" rx="8" fill="#a371f7" fill-opacity="0.13" stroke="#a371f7"/>
  <text x="755" y="118" text-anchor="middle" fill="#8b949e">nginx :443</text>

  <rect x="655" y="175" width="200" height="45" rx="8" fill="#3fb950" fill-opacity="0.13" stroke="#3fb950"/>
  <text x="755" y="203" text-anchor="middle" fill="#8b949e">herdr-eternal-server</text>

  <rect x="655" y="260" width="200" height="45" rx="8" fill="#3fb950" fill-opacity="0.13" stroke="#3fb950"/>
  <text x="755" y="288" text-anchor="middle" fill="#8b949e">herdr (server)</text>

  <line x1="755" y1="135" x2="755" y2="175" stroke="#8b949e" marker-end="url(#arrow)"/>
  <line x1="755" y1="220" x2="755" y2="260" stroke="#8b949e" marker-end="url(#arrow)"/>

  <!-- Paths -->
  <line x1="245" y1="185" x2="655" y2="115" stroke="#8b949e" marker-end="url(#arrow)"/>
  <text x="450" y="132" text-anchor="middle" fill="#8b949e" font-size="12">fallback: WSS :443</text>

  <line x1="245" y1="205" x2="655" y2="205" stroke="#8b949e" marker-end="url(#arrow)"/>
  <text x="450" y="198" text-anchor="middle" fill="#8b949e" font-size="12">preferred: QUIC UDP :7443</text>
</svg>
