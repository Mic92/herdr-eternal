<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- Laptop -->
  <rect x="20" y="50" width="240" height="210" rx="10" fill="none" stroke="#8b949e" stroke-dasharray="6 4"/>
  <text x="140" y="75" text-anchor="middle" fill="#8b949e" font-weight="bold">laptop (roaming)</text>

  <rect x="45" y="95" width="190" height="45" rx="8" fill="#1f6feb" fill-opacity="0.13" stroke="#1f6feb"/>
  <text x="140" y="123" text-anchor="middle" fill="#8b949e">herdr --remote</text>

  <rect x="45" y="185" width="190" height="45" rx="8" fill="#1f6feb" fill-opacity="0.13" stroke="#1f6feb"/>
  <text x="140" y="213" text-anchor="middle" fill="#8b949e">herdr-eternal-ssh</text>

  <line x1="140" y1="140" x2="140" y2="185" stroke="#8b949e" marker-end="url(#arrow)"/>
  <text x="150" y="168" fill="#8b949e" font-size="12">ssh_command</text>

  <!-- Server host -->
  <rect x="620" y="30" width="280" height="290" rx="10" fill="none" stroke="#8b949e" stroke-dasharray="6 4"/>
  <text x="760" y="55" text-anchor="middle" fill="#8b949e" font-weight="bold">server (NixOS)</text>

  <rect x="645" y="75" width="120" height="45" rx="8" fill="#a371f7" fill-opacity="0.13" stroke="#a371f7"/>
  <text x="705" y="103" text-anchor="middle" fill="#8b949e">nginx :443</text>

  <rect x="645" y="160" width="230" height="45" rx="8" fill="#3fb950" fill-opacity="0.13" stroke="#3fb950"/>
  <text x="760" y="188" text-anchor="middle" fill="#8b949e">herdr-eternal-server</text>

  <rect x="645" y="250" width="230" height="45" rx="8" fill="#3fb950" fill-opacity="0.13" stroke="#3fb950"/>
  <text x="760" y="278" text-anchor="middle" fill="#8b949e">login shell sessions</text>

  <line x1="705" y1="120" x2="740" y2="160" stroke="#8b949e" marker-end="url(#arrow)"/>
  <line x1="760" y1="205" x2="760" y2="250" stroke="#8b949e" marker-end="url(#arrow)"/>

  <!-- Paths -->
  <line x1="235" y1="197" x2="645" y2="99" stroke="#8b949e" marker-end="url(#arrow)"/>
  <text x="440" y="122" text-anchor="middle" fill="#8b949e" font-size="12">fallback: WSS :443</text>

  <line x1="235" y1="212" x2="645" y2="180" stroke="#8b949e" marker-end="url(#arrow)"/>
  <text x="440" y="180" text-anchor="middle" fill="#8b949e" font-size="12">preferred: QUIC UDP :7443</text>
  <text x="440" y="215" text-anchor="middle" fill="#8b949e" font-size="12">reconnect + byte-exact resume</text>

</svg>
