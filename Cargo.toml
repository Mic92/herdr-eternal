[workspace]
resolver = "2"
members = ["proto", "server", "client"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Mic92/herdr-eternal-server"

[workspace.dependencies]
herdr-eternal-proto = { path = "proto" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-std", "io-util", "sync", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
toml = "0.8"
tempfile = "3"
# native-roots so self-hosted CAs in the system trust store (NixOS
# security.pki.certificateFiles) work for the OIDC issuer.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
jsonwebtoken = "9"
serde_json = "1"
axum = "0.8"
rsa = "0.9"
rand = "0.8"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
