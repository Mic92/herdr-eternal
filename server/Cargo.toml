[package]
name = "herdr-eternal-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Companion server providing exec channels for herdr --remote over WebSocket/QUIC"

[features]
# Fake OIDC issuer for integration tests (also used by the client's tests).
test-util = ["dep:axum", "dep:rsa", "dep:rand", "dep:base64", "dep:serde_json"]

[dependencies]
herdr-eternal-proto = { workspace = true }
futures-util = { workspace = true }
jsonwebtoken = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tempfile = { workspace = true }
axum = { workspace = true, optional = true }
rsa = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
herdr-eternal-server = { path = ".", features = ["test-util"] }
